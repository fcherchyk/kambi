[project]
name = "kambi-api"
version = "0.1.0"
description = "Kambi kanban board API"
requires-python = "==3.12.*"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "joserfc>=1.6",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0.30",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pgserver>=0.1.4",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "testcontainers[postgres]>=4.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]
